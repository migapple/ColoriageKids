<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Coloriage Kids</title>
<style>
:root{--gold:#F5C842;--ink:#1A1A2E;--ink2:#16213E;--fs:1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#FFF8F0}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#FFF8F0;overflow:hidden}

/* HEADER */
.header{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:8px;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding-left:12px;padding-right:12px;border-bottom:2px solid #FFD6A0;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.header-title{font-family:'Georgia',serif;font-size:calc(18px * var(--fs));color:#E8830A;font-weight:bold}
.header-nav{display:flex;align-items:center;gap:8px}
.nav-btn{width:36px;height:36px;background:#FFE5C0;border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav-btn:active{background:#FFD08A}
.nav-counter{font-size:13px;color:#aaa;min-width:40px;text-align:center}

/* CANVAS ZONE */
.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:#FFF8F0}
#colorCanvas{display:block;touch-action:none;cursor:crosshair;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.loading-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#FFF8F0;font-size:32px}

/* PALETTE */
.palette-wrap{flex-shrink:0;background:#fff;border-top:2px solid #FFD6A0;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.palette-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.color-btn{flex:1;aspect-ratio:1;max-width:44px;max-height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:center}
.color-btn.selected{border-color:#333;transform:scale(1.2);box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.color-btn:active{transform:scale(0.95)}
.tool-btn{width:44px;height:44px;background:#f0f0f0;border:none;border-radius:12px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tool-btn:active{background:#ddd}
.tool-btn.selected{background:#FFE5C0;border:2px solid #E8830A}
.tool-btn:disabled{opacity:0.3;cursor:default}

/* ANIMAL NAME */
.animal-name{text-align:center;font-family:'Georgia',serif;font-size:calc(13px * var(--fs));color:#bbb;padding:4px 0 0;letter-spacing:1px;text-transform:uppercase}

/* ATTRIBUTION */
.attribution{text-align:center;font-size:9px;color:#ccc;padding:2px 0;padding-bottom:calc(2px + env(safe-area-inset-bottom))}
.attribution a{color:#ccc}

/* SETTINGS */
.settings-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#FFF8F0;z-index:400;display:none;flex-direction:column;overflow:hidden}
.settings-overlay.open{display:flex}
.settings-header{padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:10px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding-left:14px;padding-right:14px;border-bottom:2px solid #FFD6A0;flex-shrink:0}
.settings-header-title{font-family:'Georgia',serif;font-size:18px;color:#E8830A;font-weight:bold}
.settings-close{font-size:24px;cursor:pointer;color:#E8830A;padding:4px 8px}
.settings-body{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.settings-section-title{color:#E8830A;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:bold}
.apps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.app-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.app-icon{width:60px;height:60px;border-radius:14px;background:#FFE5C0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.app-icon img{width:60px;height:60px;border-radius:14px;object-fit:cover}
.app-name{font-size:9px;color:#888;text-align:center;line-height:1.3;max-width:68px}
.settings-badge{display:block;margin:0 auto;width:160px}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-title">🎨 Coloriage Kids</div>
    <button class="tool-btn" id="langBtn" style="background:#FFE5C0;margin-right:4px;font-size:18px">🇫🇷</button>
    <button class="tool-btn" id="settingsBtn" style="background:#FFE5C0;margin-right:4px">📱</button>
    <div class="header-nav">
      <button class="nav-btn" id="prevBtn">◀</button>
      <div class="nav-counter" id="navCounter">1/7</div>
      <button class="nav-btn" id="nextBtn">▶</button>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="loading-overlay" id="loadingOverlay">⏳</div>
    <canvas id="colorCanvas"></canvas>
  </div>

  <div class="animal-name" id="animalName">Chien</div>

  <div class="palette-wrap">
    <div class="palette-row" id="paletteRow"></div>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-header">
    <div class="settings-header-title">📱 Autres apps</div>
    <div class="settings-close" id="settingsClose">✕</div>
  </div>
  <div class="settings-body">
    <div class="settings-section-title">Applications Kids</div>
    <div class="apps-grid" id="appsGrid"></div>
    <a href="https://apps.apple.com/developer/michel-garlandat/id368771203" target="_blank">
      <img class="settings-badge" src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/fr-fr" alt="App Store">
    </a>
  </div>
</div>

<script>

var APPS = [
  {id:6772937635, name:'Animaux Kids'},
  {id:6772548541, name:'Lettres Kids'},
  {id:6772546976, name:'Chiffres Kids'},
  {id:6772468506, name:'Mahjong Kids'}
];

function renderSettings(){
  var grid = document.getElementById('appsGrid');
  grid.innerHTML = '';
  APPS.forEach(function(app){
    var item = document.createElement('div');
    item.className = 'app-item';
    var img = document.createElement('img');
    img.style.cssText = 'width:60px;height:60px;border-radius:14px;object-fit:cover';
    var iconDiv = document.createElement('div');
    iconDiv.className = 'app-icon';
    iconDiv.appendChild(img);
    var nameDiv = document.createElement('div');
    nameDiv.className = 'app-name';
    nameDiv.textContent = app.name;
    item.appendChild(iconDiv);
    item.appendChild(nameDiv);
    item.onclick = function(){ window.open('https://apps.apple.com/app/id'+app.id,'_blank'); };
    grid.appendChild(item);
    var cb = 'itcb'+app.id;
    window[cb] = function(d){ if(d.results&&d.results[0]) img.src = d.results[0].artworkUrl60; };
    var s = document.createElement('script');
    s.src = 'https://itunes.apple.com/lookup?id='+app.id+'&callback='+cb;
    document.body.appendChild(s);
  });
}

var LANG = localStorage.getItem('coloriage_lang') || 'fr';

var ANIMALS = [
  {fr:'Chien',   en:'Dog',     file:'assets/chien.jpg'},
  {fr:'Tigre',   en:'Tiger',   file:'assets/tigre.jpg'},
  {fr:'Cerf',    en:'Deer',    file:'assets/cerf.jpg'},
  {fr:'Dragon',  en:'Dragon',  file:'assets/dragon.jpg'},
  {fr:'Licorne', en:'Unicorn', file:'assets/licorne.jpg'},
  {fr:'Renard',  en:'Fox',     file:'assets/renard.jpg'},
  {fr:'Lapin',   en:'Rabbit',  file:'assets/lapin.jpg'},
  {fr:'Tortue',   en:'Turtle',  file:'assets/tortue.jpg'},
  {fr:'Singe',   en:'monkey',  file:'assets/singe.jpg'},
  {fr:'Chat',   en:'Cat',  file:'assets/chat.jpg'},
  {fr:'Triceratops',   en:'Triceratops',  file:'assets/triceratops.jpg'},
  {fr:'Pigeon',   en:'Pigeon',  file:'assets/pigeon.jpg'},
  {fr:'Mouton',   en:'Sheep',  file:'assets/mouton.jpg'},
  {fr:'Dinosaure',   en:'Dinosaur',  file:'assets/dinosaure.jpg'},
  {fr:'Giraphe',   en:'Giraffe',  file:'assets/giraphe.jpg'},
  {fr:'Escargot',   en:'Snail',  file:'assets/escargot.jpg'},
  {fr:'Poisson',   en:'Fish',  file:'assets/poisson.jpg'},
  {fr:'Pingouin',   en:'Penguin',  file:'assets/pingouin.jpg'},
  {fr:'Hibou',   en:'Owl',  file:'assets/hibou.jpg'},
];


function saveCanvas(idx){
  try {
    localStorage.setItem('coloriage_'+idx, canvas.toDataURL('image/png'));
  } catch(e){}
}

function loadSaved(idx){
  undoStack = [];
  updateUndoBtn();
  var saved = localStorage.getItem('coloriage_'+idx);
  if(!saved) return false;
  var img = new Image();
  img.onload = function(){ ctx.drawImage(img, 0, 0); };
  img.src = saved;
  return true;
}

function nameOf(a){ return LANG==='fr' ? a.fr : a.en; }

var COLORS = [
  '#FF4444','#FF8C00','#FFD700','#7DC95E',
  '#4DAAFF','#9B59B6','#FF69B4','#8B4513',
  '#20B2AA','#FF6B6B','#FFFFFF','#333333'
];

var currentIdx = 0;
var selectedColor = COLORS[0];
var selectedTool = 'fill'; // fill ou eraser
var canvas = document.getElementById('colorCanvas');
var ctx = canvas.getContext('2d', {willReadFrequently:true});
var originalImageData = null;
var undoStack = [];
var MAX_UNDO = 10;

function pushUndo(){
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if(undoStack.length > MAX_UNDO) undoStack.shift();
  updateUndoBtn();
}

function undo(){
  if(undoStack.length === 0) return;
  ctx.putImageData(undoStack.pop(), 0, 0);
  saveCanvas(currentIdx);
  updateUndoBtn();
}

function updateUndoBtn(){
  var btn = document.getElementById('undoBtn');
  if(btn) btn.disabled = undoStack.length === 0;
}

// ─── PALETTE ──────────────────────────────────────────────────────────────────
function buildPalette(){
  var row = document.getElementById('paletteRow');
  row.innerHTML = '';
  COLORS.forEach(function(c, i){
    var btn = document.createElement('div');
    btn.className = 'color-btn' + (c===selectedColor?' selected':'');
    btn.style.background = c;
    if(c==='#FFFFFF') btn.style.border = '3px solid #ddd';
    btn.addEventListener('touchend', function(e){
      e.preventDefault();
      selectColor(c);
    });
    btn.addEventListener('click', function(){ selectColor(c); });
    row.appendChild(btn);
  });
  // Bouton undo
  var undoBtn = document.createElement('button');
  undoBtn.className = 'tool-btn';
  undoBtn.id = 'undoBtn';
  undoBtn.textContent = '↩️';
  undoBtn.title = 'Annuler';
  undoBtn.disabled = true;
  undoBtn.addEventListener('touchend', function(e){ e.preventDefault(); undo(); });
  undoBtn.addEventListener('click', undo);
  row.appendChild(undoBtn);

  // Bouton gomme
  var eraser = document.createElement('div');
  eraser.className = 'tool-btn' + (selectedTool==='eraser'?' selected':'');
  eraser.textContent = '🧹';
  eraser.title = 'Effacer tout';
  eraser.addEventListener('touchend', function(e){ e.preventDefault(); resetCanvas(); });
  eraser.addEventListener('click', resetCanvas);
  row.appendChild(eraser);
}

function selectColor(c){
  selectedColor = c;
  selectedTool = 'fill';
  buildPalette();
}

// ─── CHARGEMENT IMAGE ─────────────────────────────────────────────────────────
function loadAnimal(idx){
  document.getElementById('loadingOverlay').style.display = 'flex';
  document.getElementById('animalName').textContent = nameOf(ANIMALS[idx]);
  document.getElementById('navCounter').textContent = (idx+1)+'/'+ANIMALS.length;

  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function(){
    var wrap = document.getElementById('canvasWrap');
    var maxW = wrap.clientWidth - 20;
    var maxH = wrap.clientHeight - 10;
    var ratio = Math.min(maxW/img.width, maxH/img.height);
    canvas.width  = Math.floor(img.width  * ratio);
    canvas.height = Math.floor(img.height * ratio);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    // Charger coloriage sauvegardé par dessus
    undoStack = [];
  updateUndoBtn();
  var saved = localStorage.getItem('coloriage_'+idx);
    if(saved){
      var savedImg = new Image();
      savedImg.onload = function(){ ctx.drawImage(savedImg, 0, 0); };
      savedImg.src = saved;
    }
    document.getElementById('loadingOverlay').style.display = 'none';
  };
  img.onerror = function(){
    document.getElementById('loadingOverlay').textContent = '❌';
  };
  img.src = ANIMALS[idx].file;
}

function resetCanvas(){
  if(originalImageData){ ctx.putImageData(originalImageData, 0, 0); localStorage.removeItem('coloriage_'+currentIdx); undoStack=[]; updateUndoBtn(); }
}

// ─── FLOOD FILL ───────────────────────────────────────────────────────────────
function hexToRgb(hex){
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function colorMatch(data, pos, target, tolerance){
  return Math.abs(data[pos]  -target[0]) <= tolerance &&
         Math.abs(data[pos+1]-target[1]) <= tolerance &&
         Math.abs(data[pos+2]-target[2]) <= tolerance &&
         data[pos+3] > 10;
}

function floodFill(x, y, fillColor){
  pushUndo();
  var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  var data = imgData.data;
  var w = canvas.width, h = canvas.height;
  var pos = (y * w + x) * 4;
  var targetColor = [data[pos], data[pos+1], data[pos+2]];
  var fill = hexToRgb(fillColor);
  var tolerance = 60;

  // Ne pas remplir si on clique sur un contour sombre
  if(targetColor[0] < 80 && targetColor[1] < 80 && targetColor[2] < 80) return;

  var stack = [[x, y]];
  var visited = new Uint8Array(w * h);

  while(stack.length){
    var p = stack.pop();
    var cx = p[0], cy = p[1];
    if(cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
    var idx = cy * w + cx;
    if(visited[idx]) continue;
    var i = idx * 4;
    if(!colorMatch(data, i, targetColor, tolerance)) continue;
    visited[idx] = 1;
    data[i]   = fill[0];
    data[i+1] = fill[1];
    data[i+2] = fill[2];
    data[i+3] = 255;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  ctx.putImageData(imgData, 0, 0);
  saveCanvas(currentIdx);
}

// ─── EVENTS TOUCH / CLICK ─────────────────────────────────────────────────────
function getCanvasPos(e){
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width  / rect.width;
  var scaleY = canvas.height / rect.height;
  var clientX = e.touches ? e.touches[0].clientX : e.clientX;
  var clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: Math.floor((clientX - rect.left) * scaleX),
    y: Math.floor((clientY - rect.top)  * scaleY)
  };
}

canvas.addEventListener('touchend', function(e){
  e.preventDefault();
  var pos = getCanvasPos(e.changedTouches ? {touches: e.changedTouches} : e);
  floodFill(pos.x, pos.y, selectedColor);
}, {passive:false});

canvas.addEventListener('click', function(e){
  var pos = getCanvasPos(e);
  floodFill(pos.x, pos.y, selectedColor);
});

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
document.getElementById('prevBtn').addEventListener('touchend', function(e){
  e.preventDefault();
  currentIdx = (currentIdx - 1 + ANIMALS.length) % ANIMALS.length;
  loadAnimal(currentIdx);
});
document.getElementById('prevBtn').addEventListener('click', function(){
  currentIdx = (currentIdx - 1 + ANIMALS.length) % ANIMALS.length;
  loadAnimal(currentIdx);
});
document.getElementById('nextBtn').addEventListener('touchend', function(e){
  e.preventDefault();
  currentIdx = (currentIdx + 1) % ANIMALS.length;
  loadAnimal(currentIdx);
});
document.getElementById('nextBtn').addEventListener('click', function(){
  currentIdx = (currentIdx + 1) % ANIMALS.length;
  loadAnimal(currentIdx);
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
function toggleLang(){
  LANG = LANG==='fr'?'en':'fr';
  localStorage.setItem('coloriage_lang', LANG);
  document.getElementById('langBtn').textContent = LANG==='fr'?'🇫🇷':'🇬🇧';
  document.getElementById('animalName').textContent = nameOf(ANIMALS[currentIdx]);
}

buildPalette();
document.getElementById('langBtn').textContent = LANG==='fr'?'🇫🇷':'🇬🇧';
loadAnimal(0);

document.getElementById('langBtn').addEventListener('touchend',function(e){ e.preventDefault(); toggleLang(); });
document.getElementById('langBtn').addEventListener('click', toggleLang);
document.getElementById('settingsBtn').addEventListener('touchend',function(e){ e.preventDefault(); renderSettings(); document.getElementById('settingsOverlay').classList.add('open'); });
document.getElementById('settingsBtn').addEventListener('click',function(){ renderSettings(); document.getElementById('settingsOverlay').classList.add('open'); });
document.getElementById('settingsClose').addEventListener('touchend',function(e){ e.preventDefault(); document.getElementById('settingsOverlay').classList.remove('open'); });
document.getElementById('settingsClose').addEventListener('click',function(){ document.getElementById('settingsOverlay').classList.remove('open'); });
</script>
</body>
</html>
